var BCOL=['#FF8FB8','#7FD8FF','#FFD76A','#B497FF','#7FE0A8'];
function balloonQ(lv,nopt){
  var r=Math.random(),a,b,ans,txt,near=[];
  if(lv===1){
    if(r<.45){a=pick([2,3,4,5,10]);b=rnd(2,9);ans=a*b;txt=a+' '+DOT+' '+b;near=[(a+1)*b,a*(b+1),a*(b-1),ans+a,ans-a];}
    else if(r<.7){b=pick([2,3,4,5,10]);ans=rnd(2,9);a=b*ans;txt=a+' : '+b;near=[ans+1,ans-1,ans+2,b+ans,a-b];}
    else{a=rnd(10,40);b=rnd(2,9);ans=a+b;txt=a+' + '+b;}
  }else if(lv===2){
    if(r<.35){a=rnd(3,9);b=rnd(3,9);ans=a*b;txt=a+' '+DOT+' '+b;near=[(a+1)*b,a*(b+1),a*(b-1),(a-1)*b,ans+a,ans-b];}
    else if(r<.55){b=rnd(3,9);ans=rnd(3,9);a=b*ans;txt=a+' : '+b;near=[ans+1,ans-1,ans+2,ans-2,a-b,b+ans];}
    else if(r<.8){a=rnd(25,69);b=rnd(12,29);ans=a+b;txt=a+' + '+b;}
    else{a=rnd(40,99);b=rnd(11,a-9);ans=a-b;txt=a+' '+MINUS+' '+b;}
  }else{
    if(r<.3){a=rnd(6,9);b=rnd(6,9);ans=a*b;txt=a+' '+DOT+' '+b;near=[(a+1)*b,a*(b+1),a*(b-1),(a-1)*b,ans+a,ans-b,ans+b];}
    else if(r<.5){b=rnd(4,9);ans=rnd(6,12);a=b*ans;txt=a+' : '+b;near=[ans+1,ans-1,ans+2,ans-2,a-b,b+ans];}
    else if(r<.75){a=rnd(45,89);b=rnd(25,58);ans=a+b;txt=a+' + '+b;}
    else{a=rnd(100,300);b=rnd(30,a-40);ans=a-b;txt=a+' '+MINUS+' '+b;}
  }
  /* Falsche Antworten: typische Denkfehler, nah an der Lösung, nicht offensichtlich */
  var ones=ans%10,tens=Math.floor(ans/10)%10,swap=ans>=10?(ans-ans%100)+ones*10+tens:0;
  var cand=near.concat([ans+10,ans-10,ans+1,ans-1,ans+2,ans-2,ans+20,ans-20,swap,ans+9,ans-9,ans+11,ans-11]);
  var seen={},w=[];shuffle(cand).forEach(function(x){if(x>0&&x!==ans&&!seen[x]){seen[x]=1;w.push(x);}});
  w=w.slice(0,(nopt||4)-1);
  return {txt:txt,ans:ans,opts:shuffle([ans].concat(w))};
}

function reportData(){
  var cut=dayKey(Date.now()-6*864e5),by={},tot=0,ft=0;
  save.log.forEach(function(x){
    if(x.d<cut)return;
    var r=by[x.w]||(by[x.w]={n:0,f:0});r.n++;r.f+=x.f;tot++;ft+=x.f;
  });
  var days=0;for(var i=0;i<7;i++){if(save.days[dayKey(Date.now()-i*864e5)])days++;}
  var strong=[],weak=[],none=[],rows=[];
  WORLDS.forEach(function(w){
    var r=by[w.id];
    if(!r){none.push(w.name);return;}
    var pc=Math.round(r.f/r.n*100);rows.push({name:w.name,n:r.n,pc:pc});
    if(r.n>=4&&pc>=80)strong.push(w.name);
    else if(r.n>=4&&pc<60)weak.push(w.name);
  });
  rows.sort(function(a,b){return b.n-a.n;});
  var t=['Wochenbericht von '+save.name+' (Haustier: '+(save.pet.name||'Rolli')+')','',
    'Aufgaben in den letzten 7 Tagen: '+tot+(tot?', davon '+ft+' gleich beim ersten Versuch richtig ('+Math.round(ft/tot*100)+' %)':''),
    'Tage mit Üben: '+days+' von 7 (aktuelle Serie: '+streakDays()+')'];
  if(strong.length)t.push('','Stark: '+strong.join(', '));
  if(weak.length)t.push('Noch üben: '+weak.join(', '));
  if(!strong.length&&!weak.length&&tot)t.push('','Für eine Einschätzung braucht es mindestens 4 Aufgaben pro Thema.');
  if(none.length&&none.length<WORLDS.length)t.push('Diese Woche nicht geübt: '+none.join(', '));
  var pnr=pathNext();t.push('','Lernpfad: '+(pnr?'Schritt '+(pnr.i+1)+' von '+PATH.length+' ('+pstepName(pnr.s)+')':'alle Schritte durch'));
  return {tot:tot,ft:ft,days:days,rows:rows,strong:strong,weak:weak,none:none,text:t.join('\n')};
}

function famQ(){
  var a=rnd(3,9),b=rnd(2,9),n=a*b;
  return stg('Diese Aufgaben gehören zu einer Familie. Welche Zahl fehlt?',a+' '+DOT+' '+b+' = '+n+' und '+n+' : '+b+' = ?',a,[b,a+1,a-1,n],
   'Mal und Geteilt sind Freunde. Wenn '+a+' '+DOT+' '+b+' = '+n+' ist: Wie oft passt die '+b+' in die '+n+'?',
   a+' '+DOT+' '+b+' = '+n+', also ist '+n+' : '+b+' = '+a+' und auch '+n+' : '+a+' = '+b+'.');
}
function umkehrQ(){
  var d=rnd(3,9),q=rnd(3,9),n=d*q;
  return stg('Welche Zahl fehlt? So findest du das Ergebnis von '+n+' : '+d+'.','? '+DOT+' '+d+' = '+n,q,[q+1,q-1,d,n-d],
   'Zähle in '+d+'er-Schritten: '+d+', '+2*d+', '+3*d+' ... Bei welcher Zahl landest du bei '+n+'?',
   q+' '+DOT+' '+d+' = '+n+', also ist '+n+' : '+d+' = '+q+'.');
}
function arrdivQ(){
  var d=rnd(2,8),q=rnd(2,9),n=d*q,th=pick(['Blumen','Äpfel','Sticker','Kekse','Murmeln']);
  return stg(n+' '+th+' liegen in '+d+' gleich langen Reihen. Wie viele sind in jeder Reihe?','',q,[q+1,q-1,d,n-d],
   'Verteile die '+n+' der Reihe nach auf '+d+' Reihen. Oder frag: '+d+' mal wie viel ist '+n+'?',
   n+' : '+d+' = '+q+', denn '+d+' '+DOT+' '+q+' = '+n+'.');
}
function kdivQ(){
  var d=pick([3,4,6,7,8,9]),q=rnd(6,9),n=d*q,a=5*d,b=(q-5)*d;
  return stg('Rechne: '+n+' : '+d,'',q,[q+1,q-1,q-5,n-d],
   'Zerlege die '+n+' in '+a+' und '+b+'. Die '+a+' kannst du mit der 5er-Reihe teilen.',
   n+' = '+a+' + '+b+'. '+a+' : '+d+' = 5 und '+b+' : '+d+' = '+(q-5)+'. Zusammen: 5 + '+(q-5)+' = '+q+'.');
}
function kdiv2Q(){
  var d=pick([2,5,10]),q=rnd(2,10),n=d*q;
  return stg('Rechne: '+n+' : '+d,'',q,[q+1,q-1,d,n-d],
   'Zähle in '+d+'er-Schritten bis '+n+': '+d+', '+2*d+', '+3*d+' ... Wie viele Schritte sind es?',
   n+' : '+d+' = '+q+', denn '+d+' '+DOT+' '+q+' = '+n+'.');
}
function evenoddQ(){
  if(Math.random()<.5){
    var n=rnd(11,99),od=n%2===1;
    return {prompt:'Ist die Zahl gerade oder ungerade?',big:String(n),choices:['gerade','ungerade'],answer:od?1:0,
      hint:'Schau nur auf die letzte Ziffer: 0, 2, 4, 6, 8 sind gerade. 1, 3, 5, 7, 9 sind ungerade.',
      explain:n+' endet auf '+(n%10)+'. '+(od?'Das ist ungerade: Beim Paare-Bilden bleibt einer übrig.':'Das ist gerade: Alle haben einen Partner.')};
  }
  var o=rnd(5,49)*2+1,e1=rnd(5,49)*2,e2=rnd(5,49)*2;if(e1===e2)e2+=2;
  var ch=shuffle([o,e1,e2]);
  return {prompt:'Welche dieser Zahlen ist ungerade?',big:'',choices:ch.map(String),answer:ch.indexOf(o),
    hint:'Schau auf die letzte Ziffer. Ungerade endet auf 1, 3, 5, 7 oder 9.',explain:o+' endet auf '+(o%10)+'. Darum ist sie ungerade. Die anderen sind gerade.'};
}
function halfQ(){
  if(Math.random()<.5){
    var n=rnd(6,50)*2,k=n/2;
    return stg('Was ist die Hälfte von '+n+'?','',k,[k+1,k-1,n-2,Math.floor(k/2)],
     'Die Hälfte ist: in 2 gleiche Teile teilen. Halbiere erst die Zehner, dann die Einer.',n+' : 2 = '+k+', denn '+k+' + '+k+' = '+n+'.');
  }
  var k2=rnd(6,49),n2=2*k2;
  return stg('Was ist das Doppelte von '+k2+'?','',n2,[n2+1,n2-1,k2+2,n2+10],
   'Das Doppelte ist zweimal dasselbe. Verdopple erst die Zehner, dann die Einer.',k2+' + '+k2+' = '+n2+'.');
}
function nachbzQ(){
  var n,tries=0;do{n=rnd(11,98);tries++;}while((n%10===0||n%10===5)&&tries<50);
  var lo=Math.floor(n/10)*10,hi=lo+10,r=Math.round(n/10)*10,o=r===lo?hi:lo;
  return stg('Welcher volle Zehner liegt am nächsten bei '+n+'?','',r,[o,lo-10,hi+10,n],
   'Schau auf die Einer: Bei 1 bis 4 geht es nach unten, bei 6 bis 9 nach oben.',
   n+' liegt zwischen '+lo+' und '+hi+'. Näher dran ist die '+r+'.');
}
function nachbhQ(){
  var n,tries=0;do{n=rnd(120,980);tries++;}while((n%100<12||n%100===50||n%100>88)&&tries<50);
  var lo=Math.floor(n/100)*100,hi=lo+100,r=Math.round(n/100)*100,o=r===lo?hi:lo;
  return stg('Welcher volle Hunderter liegt am nächsten bei '+n+'?','',r,[o,lo-100,hi+100,n],
   'Schau auf die Zehner: Unter 50 geht es nach unten, ab 50 nach oben.',
   n+' liegt zwischen '+lo+' und '+hi+'. Näher dran ist die '+r+'.');
}
function zwischQ(){
  var n=rnd(12,98);if(n%10===0)n++;
  var lo=Math.floor(n/10)*10;
  return stg('Zwischen welchen vollen Zehnern liegt '+n+'?','',lo,[lo-10,lo+10,lo-20],
   'Welcher Zehner ist kleiner als '+n+', und welcher ist der nächste danach?',
   n+' liegt zwischen '+lo+' und '+(lo+10)+'.',function(x){return x+' und '+(x+10);});
}
function trickQ(){
  var t=pick([['+',9],['+',11],[MINUS,9],[MINUS,11]]),a=rnd(31,86),plus=t[0]==='+',r=plus?a+t[1]:a-t[1],by=plus?a+10:a-10;
  var adj=plus?(t[1]===9?-1:1):(t[1]===9?1:-1);
  return stg('Rechne im Kopf: '+a+' '+t[0]+' '+t[1],'',r,[r+10,r-10,r+2,r-2],
   'Rechne erst '+t[0]+' 10, das ist leicht. Dann gleichst du den Unterschied aus.',
   a+' '+t[0]+' 10 = '+by+'. Dann '+(adj>0?'noch 1 dazu':'noch 1 zurück')+': '+r+'.');
}
function ergQ(){
  if(Math.random()<.5){
    var b=rnd(45,95),d=rnd(3,8),a=b+d;
    return stg('Rechne im Kopf: '+a+' '+MINUS+' '+b,'',d,[d+1,d-1>0?d-1:d+2,d+10,a],
     'Die Zahlen liegen nah beieinander. Zähle von '+b+' nach oben bis '+a+'.',
     'Von '+b+' bis '+a+' sind es '+d+' Schritte. Also '+a+' '+MINUS+' '+b+' = '+d+'.');
  }
  var b2=rnd(21,89),r=100-b2;
  return stg('Rechne im Kopf: 100 '+MINUS+' '+b2,'',r,[r+10,r-10,r+1,r-1],
   'Ergänze '+b2+' bis zur 100: erst bis zum nächsten Zehner, dann bis 100.',
   b2+' + '+r+' = 100. Also 100 '+MINUS+' '+b2+' = '+r+'.');
}
function nachbmalQ(){
  var a=rnd(3,8),b=rnd(3,9),up=Math.random()<.6,n=a*b,r=up?n+b:n-b,a2=up?a+1:a-1;
  return stg('Du weißt: '+a+' '+DOT+' '+b+' = '+n+'. Was ist '+a2+' '+DOT+' '+b+'?','',r,[up?n+a:n-a,n+1,r+b,a2*(b+1)],
   up?'Eine Reihe mehr! Du musst nur '+b+' dazuzählen.':'Eine Reihe weniger! Du musst nur '+b+' abziehen.',
   a2+' '+DOT+' '+b+' = '+n+(up?' + ':' '+MINUS+' ')+b+' = '+r+'.');
}
function halb5Q(){
  var x=rnd(3,9),t=x*10;
  return stg('Wenn '+x+' '+DOT+' 10 = '+t+' ist, was ist dann '+x+' '+DOT+' 5?','',t/2,[t/2+5,t/2-5,t-5,x+5],
   'Fünf ist die Hälfte von zehn. Halbiere das Ergebnis.',x+' '+DOT+' 5 ist die Hälfte von '+t+': '+t/2+'.');
}

 {t:'lvl',w:'plus',l:1},{t:'mod',r:'zehneruebergang'},{t:'lvl',w:'plus',l:2},{t:'mod',r:'minusweg'},{t:'mod',r:'hundert'},{t:'mod',r:'kopfpm'},

function pstepName(s){
  if(s.t==='check')return 'Kennenlern-Check';
  if(s.t==='mix')return 'Rechen-Mix';
  if(s.t==='mod')return modOf(s.r).name;
  var w=W(s.w);return w.name+': '+w.levels[s.l-1].t;
}
function pstepSub(s){
  if(s.t==='check')return 'Rolli lernt dich kennen. Kein Test, keine Noten.';
  if(s.t==='mix')return 'Gemischte Aufgaben aus vielen Themen. Dafür gibt es Bonus-Münzen.';
  if(s.t==='mod')return modOf(s.r).sub+'. Ohne Punkte, in Ruhe.';
  return 'Aufgaben lösen und Sterne holen. '+W(s.w).levels[s.l-1].d+'.';
}
function pstepDone(s,i){
  if(i<(save.pstart||0))return true;
  if(s.t==='check')return !!save.check;
  if(s.t==='mod')return rated(s.r)>=2||(save.ptry['m:'+s.r]||0)>=2;
  return starsFor(s.w,s.l)>=2||(save.ptry['l:'+s.w+'-'+s.l]||0)>=3;
}
function pathNext(){
  for(var i=0;i<PATH.length;i++){if(PATH[i].t==='lvl'&&!W(PATH[i].w))continue;if(!pstepDone(PATH[i],i))return {i:i,s:PATH[i]};}
  return null;
}
function reviewStep(){
  var m=MODS.filter(function(x){return rated(x.id)===1;})[0];
  if(m)return {t:'mod',r:m.id};
  var best=null;
  PATH.forEach(function(s){
    if(s.t!=='lvl'||!W(s.w)||!unlocked(s.w,s.l))return;
    var st=starsFor(s.w,s.l);if(st>=3)return;
    if(!best||st<best.st)best={st:st,s:s};
  });
  return best?best.s:{t:'lvl',w:'plus',l:1};
}
function afterPath(){var m=MODS.filter(function(x){return rated(x.id)===1;})[0];return m?{t:'mod',r:m.id}:{t:'mix'};}
function tagNow(){var t=dayKey();if(!save.tag||save.tag.d!==t)save.tag={d:t,l:0,s:0,p:0};return save.tag;}
function tagDone(k){
  var t=tagNow();if(t[k])return;
  t[k]=1;persist();
  var n=(t.l?1:0)+(t.s?1:0)+(t.p?1:0);
  setTimeout(function(){toast(n>=3?'Alle drei Stationen geschafft! Zu Hause wartet dein Schatz.':'Station geschafft! '+n+' von 3.');},300);
}
var GORDER=['balloon','catch','race','mem'];
function dayGame(){
  var base=Math.floor(Date.now()/864e5)%4;

  return null;
}
function goInfo(){
  var t=tagNow(),today=dayKey(),dn=save.days[today]||0,got=save.daily.d===today&&save.daily.got;
  var L=t.l||dn>=5,i;
  if(!L){
    var pn=pathNext(),st=pn?pn.s:afterPath();

  }
  if(!t.s){
    var g=dayGame();

    var rs=reviewStep();

function runStep(s){
  S.help=false;

  S.w=s.w;var l=s.l;while(l>1&&!unlocked(s.w,l))l--;

function doGo(){
  var info=goInfo();sfx('tap');

    else runStep(info.step);
    return;
  }
  if(info.k==='p'){
    if(isEgg()){S.say='Streichle mich! Ich werde schön warm.';render();return;}
    if(save.pet.hunger<70){S.shopMsg='';S.tab='food';show('shop');return;}
    S.say=save.on.toys.length?'Spiel mit mir! Tippe auf ein Spielzeug oder streichle mich.':'Streichle mich mit dem Finger, das mag ich!';render();return;
  }
  if(!info.got){save.daily={d:dayKey(),got:true};save.coins+=5;persist();S.say='Schatz gefunden! Du bekommst 5 Münzen.';sfx('coin');confetti();render();return;}
  var pn=pathNext();runStep(pn?pn.s:afterPath());
}

/* ---------- Üben, füttern, wiederholen ---------- */
function qkey(q){return q.prompt+'|'+q.big+'|'+q.choices.join('/');}
function addReview(q){
  var k=qkey(q);
  if(save.review.some(function(r){return r.k===k;}))return;
  save.review.push({k:k,w:q.world,l:q.lv||1,q:q});
  if(save.review.length>40)save.review.shift();
  persist();
}
function removeReview(q){var k=qkey(q);save.review=save.review.filter(function(r){return r.k!==k;});persist();}
function resetStage(){S.picked=[];S.solved=false;S.revealed=false;S.hint=false;S.msg='';}
function beginQ(){
  resetStage();S.gain=0;S.coinGain=0;S.grew=false;
  var q=S.qs[S.i];
  S.g=(q&&q.stages&&q.gdef&&S.mode!=='check')?{si:0,miss:0}:null;
}
function startLevel(l){
  var qs=[],seen={},tries=0;
  while(qs.length<5&&tries<80){tries++;var q=makeQ(S.w,l),key=qkey(q);if(!seen[key]){seen[key]=1;qs.push(q);}}
  var pool=save.review.filter(function(r){return r.w===S.w&&r.l<=l;});
  if(pool.length){var r=pick(pool),c=JSON.parse(JSON.stringify(r.q));c.rev=true;qs[rnd(1,qs.length-1)]=c;}
  S.mode='level';S.l=l;S.qs=qs;S.i=0;S.gold=0;S.results=[];S.streak=0;S.lvCoins=0;beginQ();
  show('quiz');
}
function startCheck(){
  var plan=[['plus',1],['plus',2],['mal',1],['mal',2],['mal',3],['laenge',1],['euro',1],['punkt',1],['zahlen',1],['sadd',1]];
  S.mode='check';S.l=1;S.qs=plan.map(function(x){return makeQ(x[0],x[1]);});S.i=0;S.gold=0;S.results=[];S.streak=0;S.chk={};S.lvCoins=0;beginQ();
  show('quiz');
}
function praise(first){
  var m=first?pick(['Mmh, lecker! Richtig!','Genau so! Das schmeckt.','Stark! Mehr davon!','Yes, das sitzt!','Super gerechnet, danke!']):pick(['Geschafft! Dranbleiben lohnt sich.','Richtig! Beim zweiten Mal hat es geklappt.']);
  if(S.streak>=3)m+=' '+S.streak+' in Folge!';
  return m;
}
function finalizeQ(first,rev){
  var q=S.qs[S.i],p=save.pet,before=stageOf(p.xp);
  logAns(q.world,q.lv||S.l,first&&!rev);
  if(S.mode==='check'){var c=S.chk[q.world]||(S.chk[q.world]=[0,0]);c[1]++;if(first&&!rev)c[0]++;}
  if(rev){S.results[S.i]='miss';S.gain=0;S.coinGain=0;S.streak=0;persist();return;}
  tick();
  S.gain=first?12:6;S.coinGain=first?3:1;
  p.hunger=Math.min(100,p.hunger+S.gain);p.xp+=first?2:1;save.coins+=S.coinGain;S.lvCoins+=S.coinGain;addTotal(1);
  S.grew=stageOf(p.xp)>before;
  if(first){S.gold++;S.streak++;if(q.rev)removeReview(q);}else S.streak=0;
  S.results[S.i]=first?'gold':'silver';
  S.msg=praise(first)+(S.grew?' {pet} ist gewachsen!':'');
  if(isEgg()){var eg=save.pet.egg;eg.n=Math.min(10,eg.n+1);S.msg=(first?'Richtig! ':'Geschafft! ')+(eg.n>=10?'Es klopft von innen: Das Ei will schlüpfen!':'Das Ei wird wärmer ('+eg.n+' von 10).');}
  persist();sfx(S.grew?'big':'yum');
}
function answer(idx){
  var q=S.qs[S.i],cur=curQ();
  if(S.solved||S.revealed||S.picked.indexOf(idx)>-1)return;
  var last=!S.g||S.g.si===q.stages.length-1;
  if(idx===cur.answer){
    var first=S.picked.length===0;
    S.solved=true;
    if(last)finalizeQ(S.g?S.g.miss===0:first,false);
    else{S.msg=pick(['Richtig! Weiter geht es.','Genau! Nächster Schritt.','Super, das stimmt!']);sfx('yum');}
  }else{
    if(S.picked.length===0){addReview(q);if(S.g)S.g.miss++;}
    S.picked.push(idx);S.streak=0;sfx('oops');
    if(S.picked.length>=2){
      S.revealed=true;
      S.msg='Das war knifflig. Schau dir die Lösung an, dann klappt es beim nächsten Mal.';
      if(last)finalizeQ(false,true);
    }else{S.hint=true;S.msg='Fast! Lies den Tipp und versuch es noch einmal.';}
  }
  render();talk(S.msg);
}
function finish(){
  var p=save.pet;
  if(S.mode==='check'){
    save.check={done:true,res:S.chk};persist();tagDone('l');
    show('checkresult');sfx('yay');return;
  }
  S.stars=S.gold>=Math.ceil(S.qs.length*.8)?3:S.gold>=2?2:1;
  if(S.mode==='mix'){save.coins+=S.stars*2+3;S.lvCoins+=S.stars*2+3;tagDone('l');p.fun=Math.min(100,p.fun+15);persist();show('result');sfx(S.stars>=2?'yay':'big');if(S.stars>=2)confetti();return;}
  var k=S.w+'-'+S.l;
  if((save.stars[k]||0)<S.stars)save.stars[k]=S.stars;
  save.ptry['l:'+k]=(save.ptry['l:'+k]||0)+1;tagDone('l');
  save.coins+=S.stars*2;S.lvCoins+=S.stars*2;
  p.fun=Math.min(100,p.fun+15);persist();
  show('result');sfx(S.stars>=2?'yay':'big');
  if(S.stars>=2)confetti();
}

  else if(a==='pst+'){save.pstart=Math.min(PATH.length,(save.pstart||0)+1);persist();render();}
  else if(a==='basis'){S.say='';show('basis');}
  else if(a==='module'){var mo=modOf(b.dataset.id);if(mo){startDialog(mo.steps,'basis');S.dlg.mod=mo.id;sfx('tap');}}
  else if(a==='dys'){save.dys=!save.dys;persist();render();toast(save.dys?'Lesehilfe an: große Schrift, mehr Abstand, Text wird vorgelesen.':'Lesehilfe aus.');}
  else if(a==='thint'){S.dlg.thint=true;sfx('tap');render();}
  else if(a==='topt'){
    var td=S.dlg,tq=td.tq[td.ti],ti2=+b.dataset.i;
    if(td.tdone)return;
    if(ti2===tq.answer){td.tdone=true;sfx('yum');}
    else{td.tpicked.push(ti2);sfx('tap');if(td.tpicked.length>=2){td.tdone=true;td.trev=true;}}
    render();
  }
  else if(a==='tnext'){
    var tn=S.dlg;sfx('tap');
    if(tn.ti<tn.tq.length-1){tn.ti++;tn.tpicked=[];tn.tdone=false;tn.thint=false;tn.trev=false;render();window.scrollTo(0,0);}
    else if(tn.i<tn.steps.length-1){tn.i++;enterStep();render();window.scrollTo(0,0);talk(tn.steps[tn.i].t);}
    else finishDialog();
  }
  else if(a==='rate'){
    var rd=S.dlg,rv=+b.dataset.r;rd.rated=rv;
    if(rd.mod){save.basis[rd.mod]=rv;save.ptry['m:'+rd.mod]=(save.ptry['m:'+rd.mod]||0)+1;persist();tagDone('l');}
    sfx(rv===3?'big':'tap');render();
  }
  else if(a==='j100-new'){var s0=rnd(71,96);S.j100={s:s0,x:rnd(101-s0,Math.min(115-s0,19))};document.getElementById('demo').innerHTML=j100HTML();sfx('tap');}
  else if(a==='thing'){S.th.i=+b.dataset.i;document.getElementById('thdisp').innerHTML=thView();sfx('tap');}
  else if(a==='wl-add'){S.wl=Math.min(99999,S.wl+(+b.dataset.v));document.getElementById('wldisp').innerHTML=wlView();sfx('tap');}
  else if(a==='wl-clear'){S.wl=0;document.getElementById('wldisp').innerHTML=wlView();sfx('tap');}
  else if(a==='pinchg'){
    var np=(document.getElementById('newpin').value||'').trim();
    if(!/^\d{4}$/.test(np)){toast('Bitte genau 4 Ziffern eingeben.');return;}
    if(np==='9999'){toast('Diese Zahl ist nicht erlaubt. Bitte eine andere wählen.');return;}
    save.pin=np;persist();document.getElementById('newpin').value='';toast('Neuer PIN gespeichert.');
  }
  else if(a==='dnext'){var d=S.dlg;sfx('tap');if(d.i<d.steps.length-1){d.i++;enterStep();render();window.scrollTo(0,0);talk(d.steps[d.i].t);}else finishDialog();}
  else if(a==='dopt'){
    var dd=S.dlg,st=dd.steps[dd.i],oi=+b.dataset.i;
    if(dd.solved)return;
    if(oi===st.ok){dd.solved=true;sfx('yum');}else{dd.picked.push(oi);sfx('oops');}
    render();
  }
  else if(a==='bags-new'){S.demo={a:rnd(1,5),b:rnd(2,4),c:rnd(2,4)};document.getElementById('demo').innerHTML=bagsHTML();sfx('tap');}
  else if(a==='ten-fill'){S.ten.m=!S.ten.m;document.getElementById('demo').innerHTML=tenHTML();sfx('tap');}
  else if(a==='ten-new'){S.ten=newTen();document.getElementById('demo').innerHTML=tenHTML();sfx('tap');}
  else if(a==='jump-new'){S.jump=newJump();document.getElementById('demo').innerHTML=jumpHTML();sfx('tap');}
  else if(a==='rect-split'){S.rect.sp=!S.rect.sp;document.getElementById('demo').innerHTML=rectHTML();sfx('tap');}
  else if(a==='rect-new'){S.rect={a:rnd(6,9),b:rnd(6,9),sp:false};document.getElementById('demo').innerHTML=rectHTML();sfx('tap');}
  else if(a==='dm-next'){S.dm.i=S.dm.i>=S.dm.q.stages.length-1?-1:S.dm.i+1;document.getElementById('demo').innerHTML=stepHTML();sfx('tap');}
  else if(a==='gd-u'||a==='gd-f'){S.gd.m=a==='gd-u'?'u':'f';document.getElementById('demo').innerHTML=gardenHTML();sfx('tap');}
  else if(a==='plogout'){var wt0=pExit();S.say='';S.confirm='';show('home');toast(wt0?'Testmodus beendet. Selinas Stand ist wie vorher.':'Eltern-Modus beendet. Jetzt ist alles wieder für Selina.');}
  else if(a==='tteststart')startTest();
  else if(a==='ptools')show('parent');
  else if(a==='tkind'){var ck=CK.filter(function(c){return c.id===b.dataset.k;})[0];if(ck&&S.test){save.pet={kind:ck.id,egg:null,name:ck.name,hunger:70,fun:80,xp:Math.max(35,save.pet.xp||0),last:Date.now()};S.say='';toast(ck.label+' ist jetzt dein Testtier.');render();}}
  else if(a==='c20a'){S.confirm='c20';render();}
  else if(a==='c20b'){save.coins=20;persist();S.confirm='';S.codeMsg='';render();toast('Selinas Münzen stehen jetzt auf 20.');}
  else if(a==='openall'){save.open=!save.open;persist();render();toast(save.open?'Alle Stufen sind jetzt offen.':'Stufen wieder normal gesperrt.');}
  else if(a==='mute'){save.mute=!save.mute;persist();render();}
  else if(a==='music'){setMusic(!save.music);render();}
  else if(a==='speak')speak(fill(S.lastSay));
  else if(a==='pat'){
    if(S.stroked)return;
    S.say=pick(['Hihi, das kitzelt!','Das mag ich, Lehrerin {n}!','Noch einmal! Aber danach bitte Aufgaben.']);
    S.anim='wiggle';sfx('tap');tagDone('p');render();talk(S.say);
  }
  else if(a==='shop'){S.shopMsg='';show('shop');}
  else if(a==='wishgo'){var wt=b.dataset.t;if(wt==='play'){S.shopMsg='';show('play');}else{S.tab=wt==='food'?'food':wt;S.shopMsg='';show('shop');}}
  else if(a==='buy'){
    var f=FOODS.filter(function(x){return x.id===b.dataset.id;})[0],pb=save.pet;tick();
    if(!f)return;
    if(save.coins<f.cost){S.shopMsg='Dafür fehlen noch Münzen. Löse ein paar Aufgaben!';sfx('oops');}
    else if(pb.hunger>=96){S.shopMsg='Ich bin pappsatt, Lehrerin {n}. Später gern!';sfx('tap');}
    else{
      var before=stageOf(pb.xp),oldH=pb.hunger;
      save.coins-=f.cost;pb.hunger=Math.min(100,pb.hunger+f.belly);pb.fun=Math.min(100,pb.fun+f.fun);pb.xp+=f.xp;persist();
      S.shopMsg=pick(['Mmmh, '+f.name+'! Das ist lecker, danke!','Nom nom nom! '+f.name+' ist mein Lieblingsessen.','Das schmeckt!'])+(stageOf(pb.xp)>before?' Ich bin gewachsen!':'');
      S.anim='feed';sfx(stageOf(pb.xp)>before?'big':'yum');S.feedId=f.id;S.feedOld=oldH;tagDone('p');
    }
    render();talk(S.shopMsg);
    if(S.feedId){playFeed(S.feedId,S.feedOld,save.pet.hunger);S.feedId=null;}
  }
  else if(a==='play'){S.shopMsg='';show('play');}
  else if(a==='glvl'){S.gsel=b.dataset.g;show('glvl');}
  else if(a==='startgame'){S.tps=S.tps||{};S.gi={g:b.dataset.g,lv:+b.dataset.lv,tp:+(b.dataset.tp||S.tps[b.dataset.g]||1)};show('gintro');}
  else if(a==='gi-lv'){S.gi.lv=+b.dataset.v;sfx('tap');render();}
  else if(a==='gi-tp'){S.gi.tp=+b.dataset.v;S.tps=S.tps||{};S.tps[S.gi.g]=S.gi.tp;sfx('tap');render();}
  else if(a==='tmpdn')awTempo(-1);
  else if(a==='tmpup')awTempo(1);
  else if(a==='gogo'){var gg=b.dataset.g||S.gi.g,gl=+(b.dataset.lv||S.gi.lv),gt=+(b.dataset.tp||S.gi.tp||1);S.tps=S.tps||{};S.tps[gg]=gt;startGame(gg,gl,gt);}
  else if(a==='shoptab'){S.tab=b.dataset.t;S.shopMsg='';sfx('tap');render();}
  else if(a==='toy'){
    var tdy=dayKey();if(save.love.d!==tdy)save.love={d:tdy,n:0,t:0};
    var TY=TOYS.filter(function(x){return x.id===b.dataset.id;})[0];
    var tbored=toyBored(b.dataset.id);
    if(!tbored)tagDone('p');
    if(!tbored){toyLeft(b.dataset.id).n++;if(save.love.t<20){save.love.t++;save.pet.fun=Math.min(100,save.pet.fun+3);}persist();}
    S.say=tbored?pick(['Das kenne ich schon in- und auswendig. Ich hätte gern etwas Neues.','Hmm, das ist nicht mehr so spannend. Hast du etwas Neues für mich?']):({ball:'Hui, der Ball! Wirf ihn nochmal!',teddy:'Mein Teddy! Der ist so kuschelig.',trommel:'Trommelwirbel! Bum, bum, bum!',drachen:'Der Drachen fliegt ganz hoch!'})[b.dataset.id]||'Juhu, Spielzeit!';
    if(!tbored)sfx('pop');else sfx('oops');
    playToy(b.dataset.id,tbored,b);
  }
  else if(a==='item'){
    var tt=b.dataset.t,idd=b.dataset.id,lst=tt==='acc'?ACCS:tt==='toy'?TOYS:ROOMS,itm=lst.filter(function(x){return x.id===idd;})[0];
    if(!itm)return;
    var own=save.own[tt];
    if(own.indexOf(idd)<0){
      if(save.coins<itm.cost){S.shopMsg='Dafür fehlen noch Münzen.';sfx('oops');render();return;}
      save.coins-=itm.cost;own.push(idd);if(tt==='toy')save.toyL[idd]={t:Date.now(),n:0,away:0};S.shopMsg='Juhu, danke! '+itm.name+' ist toll!';sfx('big');S.anim='bounce';
      if(tt==='acc')save.on.acc=idd;else if(tt==='toy'){save.on.toys.push(idd);if(save.on.toys.length>2)save.on.toys.shift();}else save.on.room=idd;
    }else{
      sfx('tap');
      if(tt==='acc')save.on.acc=save.on.acc===idd?null:idd;
      else if(tt==='toy'){var ix=save.on.toys.indexOf(idd);if(ix>-1){save.on.toys.splice(ix,1);toyLeft(idd).away=Date.now();}else{var TL=toyLeft(idd);if(TL.away&&Date.now()-TL.away>=864e5){TL.t=Date.now();TL.n=0;}TL.away=0;save.on.toys.push(idd);if(save.on.toys.length>2)save.on.toys.shift();}}
      else save.on.room=idd;
      S.shopMsg='';
    }
    persist();render();
  }
  else if(a==='balloon')balloonTap(+b.dataset.i);
  else if(a==='racea')raceAnswer(+b.dataset.i);
  else if(a==='album')show('album');
  else if(a==='tohatch')startHatch();
  else if(a==='hatchtap'){S.ht++;sfx(S.ht>=3?'yay':'big');if(S.ht>=3)confetti();render();}
  else if(a==='grad'){confetti();sfx('yay');show('grad');}
  else if(a==='gradgo'){var pp=save.pet;save.album.push({k:pp.kind,name:pp.name,d:dayKey()});save.coins+=20;save.pet={kind:null,egg:null,name:'',hunger:40,fun:40,xp:0,last:Date.now()};persist();S.pk=null;S.say='';sfx('big');show('pick');}
  else if(a==='daily'){var td=dayKey();if(save.daily.d===td&&save.daily.got)return;save.daily={d:td,got:true};save.coins+=5;persist();S.say='Schatz gefunden! Du bekommst 5 Münzen.';sfx('coin');confetti();render();}
  else if(a==='egg1'){S.confirm='egg';render();}
  else if(a==='egg2'){save.pet={kind:null,egg:null,name:'',hunger:40,fun:40,xp:0,last:Date.now()};persist();S.confirm='';S.pk=null;S.say='';show('pick');}
  else if(a==='stopcatch'){stopCatch();S.cg=null;show('home');}
  else if(a==='memflip')memFlip(+b.dataset.i);
  else if(a==='memend')endMem();
  else if(a==='report'){S.codeMsg='';show('report');}
  else if(a==='parent'){S.codeMsg='';S.confirm='';S.pinMsg='';if(S.pOK)show('parent');else show('pin');}
  else if(a==='pinok'){
    var pv=(document.getElementById('pininp').value||'').trim();
    if(!/^\d{4}$/.test(pv)){S.pinMsg='Bitte genau 4 Ziffern eingeben.';render();return;}
    if(pv==='9999'&&!save.pin){S.pinMsg='Diese Zahl ist reserviert. Bitte wähle einen anderen PIN.';render();return;}
    if(pv==='9999'){S.pOK=true;S.codeMsg='Master-PIN akzeptiert. Der Spielstand ist unverändert. Du kannst unten einen neuen PIN festlegen.';show('parent');return;}
    if(!save.pin){save.pin=pv;persist();S.pOK=true;S.codeMsg='PIN gespeichert. Merke ihn dir gut.';show('parent');}
    else if(pv===save.pin){S.pOK=true;S.codeMsg='';show('parent');}
    else{S.pinMsg='Falscher PIN.';sfx('oops');render();}
  }
  else if(a==='pinreset'){S.pinMsg='PIN vergessen? Gib stattdessen den Master-PIN ein. Den kennen nur die Eltern. Es geht nichts verloren, der Spielstand bleibt erhalten.';render();}
  else if(a==='tcoins'){save.coins+=100;persist();S.codeMsg='+100 Münzen.';toast(S.codeMsg);render();}
  else if(a==='tdaily'){save.days[dayKey()]=Math.max(5,save.days[dayKey()]||0);save.tag={d:dayKey(),l:1,s:1,p:1};save.daily={d:'',got:false};persist();S.codeMsg='Alle drei Stationen erfüllt. Auf der Startseite wartet der Schatz.';toast(S.codeMsg);render();}
  else if(a==='tegg'){
    if(!isEgg()){S.codeMsg='Gerade ist kein Ei da. Unten unter „Neues Ei“ kannst du eins starten.';toast(S.codeMsg);render();return;}
    save.pet.egg.n=9;persist();S.codeMsg='Das Ei ist auf 9 von 10. Eine richtige Antwort noch!';toast(S.codeMsg);render();
  }
  else if(a==='tstage'){
    if(!save.pet.kind){S.codeMsg='Das Ei muss erst schlüpfen. Dann geht das hier.';toast(S.codeMsg);render();return;}
    var sx=+b.dataset.s;save.pet.xp=[0,35,100,200,300][sx];persist();S.codeMsg='Das Tier ist jetzt auf Stufe '+(sx<4?STAGES[sx]:'Abschluss bereit')+'.';toast(S.codeMsg);render();
  }
  else if(a==='copyrep')copyText(reportData().text,'reptxt');
  else if(a==='copycode')copyText(exportCode(),'codebox');
  else if(a==='codeload'){
    var v=(document.getElementById('codein').value||'').replace(/\s+/g,'');
    try{
      var o=JSON.parse(decodeURIComponent(escape(atob(v))));
      if(!o||typeof o!=='object'||!o.pet)throw new Error('x');
      save=loadFrom(o);save.pet.last=Date.now();persist();S.codeMsg='Spielstand geladen.';S.say='';
    }catch(err){S.codeMsg='Der Code passt nicht. Kopiere ihn bitte vollständig.';}
    render();
  }
  else if(a==='reset1'){S.confirm='reset';render();}
  else if(a==='resetno'){S.confirm='';render();}
  else if(a==='reset2'){save=defSave();persist();S.confirm='';S.say='';S.pk=null;S.pn='';show('names');}
  else if(a==='chooseegg'){S.pk=b.dataset.c;sfx('tap');render();}
  else if(a==='egggo'){
    save.pet={kind:null,egg:{c:S.pk,n:0},name:'',hunger:40,fun:40,xp:0,last:Date.now()};persist();sfx('big');S.say='';
    if(!save.intro)startDialog(INTRO,'intro');else show('home');
  }
  else if(a==='petgo'){
    var pn=document.getElementById('pname'),ck=ckOf(S.newKind);
    save.pet={kind:S.newKind,egg:null,name:((pn&&pn.value.trim())||ck.name).slice(0,20),hunger:40,fun:40,xp:0,last:Date.now()};persist();sfx('big');confetti();S.say='Hallo Lehrerin {n}! Ich bin da! Danke fürs Warmhalten!';show('home');
  }
  else if(a==='names'){
    var un=document.getElementById('uname');
    save.name=(un.value.trim()||'Selina').slice(0,20);save.named=true;save.pet.last=Date.now();persist();sfx('tap');
    S.pk=null;if(save.pet.kind||save.pet.egg)show('home');else show('pick');
  }
});
$app.addEventListener('input',function(e){
  var id=e.target.id,v=+e.target.value;
  if(id==='slider'){S.roll=v;document.getElementById('rolldisp').innerHTML=rollHTML(S.w,S.roll);}
  else if(id==='mmslider'){S.mm=v;document.getElementById('mmdisp').innerHTML=mmDisp(S.mm);}
  else if(id==='bdslider'){S.bd=v;document.getElementById('bddisp').innerHTML=bundleHTML(S.bd);}
  else if(id==='mtslider'){S.mt.v=v;document.getElementById('mtdisp').innerHTML=meterHTML();}
  else if(basisInput(id,v)){}
  else if(id==='gda'||id==='gdb'){if(id==='gda')S.gd.a=v;else S.gd.b=v;var dm=document.getElementById('gdview');if(dm)dm.innerHTML=gardenView();}
});
function arenaMove(e){
  if(!S.cg)return;
  var ar=e.target.closest&&e.target.closest('#arena');if(!ar)return;
  var r=ar.getBoundingClientRect();
  S.cg.x=Math.max(0,Math.min((r.width||300)-64,e.clientX-r.left-32));
}
$app.addEventListener('pointermove',arenaMove);
$app.addEventListener('pointerdown',arenaMove);

/* ---------- Eltern-Modus automatisch beenden ---------- */
S.pT=Date.now();
$app.addEventListener('click',function(){S.pT=Date.now();},true);
document.addEventListener('visibilitychange',function(){
  if(document.hidden){if(S.pOK){var wt1=pExit();S.pLogged=wt1?2:1;}}
  else{
    var g2=Math.floor((Date.now()-(save.seen||Date.now()))/864e5);
    if(g2>=1&&!S.test){S.gap=g2;S.gapDone=false;S.say='';}
    if(S.pLogged){var lg=S.pLogged;S.pLogged=0;if(lg===2||S.view==='parent'||S.view==='report'){S.say='';show('home');}else render();}
    else if(g2>=1&&S.view==='home')render();
  }
});
setInterval(function(){
  if(S.pOK&&Date.now()-S.pT>10*60*1000){var wt2=pExit();if(wt2||S.view==='parent'){S.say='';show('home');}else render();}
},30000);

/* ---------- Tier lebt: Leerlauf-Animationen ---------- */
setInterval(function(){
  if(S.view!=='home'||document.hidden||(typeof sg!=='undefined'&&sg.on))return;
  if(Date.now()-S.pT>20000&&!S.nudged&&goInfo().k!=='done'){S.nudged=1;var gb=document.querySelector('.btn.go');if(gb){gb.classList.add('nudge');setBubble('Tippe auf „Los, Rolli!“. Dann zeige ich dir, was dran ist.');}}
  var pw=document.querySelector('.scene .petwrap');if(!pw||pw.classList.contains('squish')||pw.classList.contains('hop')||pw.classList.contains('dance'))return;
  if(isEgg()){pw.classList.add('wobble');setTimeout(function(){pw.classList.remove('wobble');},1400);return;}
  var m=petMood(),r=Math.random();
  if(m==='hungry'){petSwap(pw,'hungry',150,'wiggle',1400);moodSfx('hungry',22000);if(r<.5)setBubble('Mein Bauch knurrt. Im Laden gibt es Futter!');return;}
  if(m==='sleepy'||r<.18){petSwap(pw,'sleepy',150,null,2600);moodSfx('sleepy',22000);return;}
  if(r<.5)petSwap(pw,'happy',150,'hop',900);
  else if(r<.75)petSwap(pw,'wow',150,'wiggle',900);
  else{petSwap(pw,'love',150,'hop',1100);moodSfx('love',22000);spawnHeart();spawnHeart();}
},6500);


/* ---------- App-Installation (nur auf einer echten https-Seite) ---------- */
try{if('serviceWorker' in navigator&&location.protocol==='https:'&&!/claude/i.test(location.hostname)){navigator.serviceWorker.register('sw.js').catch(function(){});}}catch(e){}
/* ---------- Start ---------- */
S.gap=save.seen?Math.floor((Date.now()-save.seen)/864e5):0;S.gapDone=false;
tick();
if(!save.named)S.view='names';
else if(!save.pet.kind&&!save.pet.egg){S.pk=null;S.view='pick';}
else if(!save.intro){S.dlg={steps:INTRO,i:0,picked:[],solved:false,ord:null,then:'intro'};S.view='dialog';}
else S.view='home';
render();
})();
</script>
